[project]
name = "tomeshift"
version = "0.2.0"
description = "Translate a whole book for under a dollar: any language, any LLM, or $0 extra on the AI subscription you already have."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]
keywords = ["translation", "book", "llm", "epub", "bangla", "claude-code", "gemini"]

[project.scripts]
tomeshift = "tomeshift:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tomeshift.py", "tomeshift_ui.py"]

[project.urls]
Homepage = "https://github.com/Hasib105/tomeshift"
Issues = "https://github.com/Hasib105/tomeshift/issues"
