[project]
name = "tomeshift"
version = "0.1.0"
description = "Translate whole books between any languages with an LLM, as cheaply as possible: via the coding-agent CLIs you already pay for, or any API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]
keywords = ["translation", "book", "llm", "epub", "bangla", "claude-code", "gemini"]

[project.scripts]
tomeshift = "tomeshift:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tomeshift.py"]

[project.urls]
Homepage = "https://github.com/Hasib105/tomeshift"
Issues = "https://github.com/Hasib105/tomeshift/issues"
