[project]
name = "tomeshift"
version = "0.3.0"
description = "Translate a whole book for under a dollar: any language, any LLM, or $0 extra on the AI subscription you already have."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]
keywords = ["translation", "book", "llm", "epub", "bangla", "claude-code", "gemini"]

[project.scripts]
tomeshift = "tomeshift:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tomeshift.py", "tomeshift_ui.py", "tomeshift_epub.py"]

[project.urls]
Homepage = "https://github.com/Hasib105/tomeshift"
Issues = "https://github.com/Hasib105/tomeshift/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501", "SIM108", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
